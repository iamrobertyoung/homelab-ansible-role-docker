---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert Docker packages are installed
      ansible.builtin.assert:
        that:
          - "item in ansible_facts.packages"
        fail_msg: "{{ item }} is not installed"
      loop:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin

    - name: Read daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: daemon_json

    - name: Assert daemon.json configures syslog logging
      ansible.builtin.assert:
        that:
          - (daemon_json.content | b64decode | from_json)['log-driver'] == 'syslog'

    - name: Check docker service
      ansible.builtin.systemd_service:
        name: docker
      register: docker_service

    - name: Assert docker service is running
      ansible.builtin.assert:
        that:
          - docker_service.status.ActiveState == 'active'
